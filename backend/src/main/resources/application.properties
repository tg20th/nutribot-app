spring.application.name=swp391_group7_nutribot
spring.main.allow-circular-references=true

server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=NutriBotV2;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:12345}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=none

spring.thymeleaf.cache=false 

#Toàn bộ trang web phải nằm trong thư mục template
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# JWT Configuration
jwt.secret=${JWT_SECRET:rAOa9otcvyPSPLqACB1miadHrc9wsmiHkpX+vkJ+1lROA3m0pOAXCVsy2bVUoAlJadI/ZKNGIW+nLxyaA/Fmiw==}
jwt.expiration=86400000
# NB-54: gateway nội bộ Spring Boot -> FastAPI, không gọi trực tiếp từ trình duyệt.
ai-service.base-url=${AI_SERVICE_BASE_URL:http://localhost:8000}
ai-service.timeout-seconds=${AI_SERVICE_TIMEOUT_SECONDS:35}
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Google OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.google.issuer-uri=https://accounts.google.com
