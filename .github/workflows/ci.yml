name: NutriBot CI Verification Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
    types: [ opened, synchronize, reopened, ready_for_review ]

permissions:
  contents: write
  pull-requests: write

jobs:
  backend-ci:
    name: Backend (Java 25 Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'oracle'
          cache: maven

      - name: Grant execute permission for mvnw
        run: |
          if [ -d "backend" ]; then
            cd backend
            chmod +x mvnw || true
            ./mvnw clean test
          else
            echo "Backend directory not found, skipping."
          fi

  frontend-ci:
    name: Frontend (React & Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check package.json exists & Build
        run: |
          if [ -d "frontend" ] && [ -f "frontend/package.json" ]; then
            cd frontend
            npm ci || npm install
            npm run build
          else
            echo "Frontend package.json not initialized yet, skipping."
          fi

  ai-service-ci:
    name: AI Microservice (Python FastAPI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies and run tests
        run: |
          if [ -d "ai-service" ] && [ -f "ai-service/requirements.txt" ]; then
            cd ai-service
            pip install -r requirements-dev.txt
            python -m compileall -q main.py app
            python -m pytest -q tests
          else
            echo "AI service not initialized yet, skipping."
          fi

  auto-merge:
    name: Auto-merge PR by Bot
    needs: [backend-ci, frontend-ci, ai-service-ci]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Merge PR Automatically
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          echo "All CI tests passed! Merging PR: $PR_URL"
          gh pr merge "$PR_URL" --squash --delete-branch --admin || gh pr merge "$PR_URL" --squash --delete-branch
