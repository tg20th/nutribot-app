name: Sync Git to Jira

# Quy trình tự động:
# 1. Push branch mới → In Progress
# 2. Tạo Pull Request → In Review
# 3. Merged PR vào main → Done

on:
  push:
    branches-ignore: [master, main]
  pull_request_target:
    types: [opened, closed, synchronize]

jobs:
  sync-jira:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Extract Jira Issue Key
        id: extract
        run: |
          if [[ "${{ github.event_name }}" == "pull_request_target" ]]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
            ISSUE_KEY=$(echo "${{ github.event.pull_request.title }}" | grep -oE 'NB-0?[0-9]+' | sed 's/NB-0\([0-9]\)/NB-\1/' | head -1)
            echo "issue_key=$ISSUE_KEY" >> $GITHUB_OUTPUT
            echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT

            if [[ "${{ github.event.action }}" == "opened" ]]; then
              echo "action=review" >> $GITHUB_OUTPUT
            elif [[ "${{ github.event.action }}" == "closed" && "${{ github.event.pull_request.merged }}" == "true" ]]; then
              echo "action=done" >> $GITHUB_OUTPUT
            fi
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            # Check if this is a merge commit from master
            if [[ "${{ github.ref }}" == "refs/heads/master" ]] || [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
              # For merge commits, extract from commit message
              ISSUE_KEY=$(echo "${{ github.event.head_commit.message }}" | grep -oE 'NB-0?[0-9]+' | sed 's/NB-0\([0-9]\)/NB-\1/' | head -1)
              if [[ -n "$ISSUE_KEY" ]]; then
                echo "issue_key=$ISSUE_KEY" >> $GITHUB_OUTPUT
                echo "action=done" >> $GITHUB_OUTPUT
              fi
            else
              # Regular push to feature branch
              ISSUE_KEY=$(echo "${{ github.event.head_commit.message }}" | grep -oE 'NB-0?[0-9]+' | sed 's/NB-0\([0-9]\)/NB-\1/' | head -1)
              echo "issue_key=$ISSUE_KEY" >> $GITHUB_OUTPUT
              echo "action=progress" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Move to In Progress
        if: steps.extract.outputs.action == 'progress' && steps.extract.outputs.issue_key != ''
        run: |
          echo "Moving ${{ steps.extract.outputs.issue_key }} to In Progress"
          curl -s -X POST \
            -u ":"${{ secrets.JIRA_AUTH }} \
            -H "Content-Type: application/json" \
            --data '{"transition": {"id": "21"}}' \
            "https://danyngo06.atlassian.net/rest/api/3/issue/${{ steps.extract.outputs.issue_key }}/transitions"

      - name: Move to In Review
        if: steps.extract.outputs.action == 'review' && steps.extract.outputs.issue_key != ''
        run: |
          echo "Moving ${{ steps.extract.outputs.issue_key }} to In Review"
          curl -s -X POST \
            -u ":"${{ secrets.JIRA_AUTH }} \
            -H "Content-Type: application/json" \
            --data '{"transition": {"id": "31"}}' \
            "https://danyngo06.atlassian.net/rest/api/3/issue/${{ steps.extract.outputs.issue_key }}/transitions"

      - name: Move to Done
        if: steps.extract.outputs.action == 'done' && steps.extract.outputs.issue_key != ''
        run: |
          echo "Moving ${{ steps.extract.outputs.issue_key }} to Done"
          curl -s -X POST \
            -u ":"${{ secrets.JIRA_AUTH }} \
            -H "Content-Type: application/json" \
            --data '{"transition": {"id": "41"}}' \
            "https://danyngo06.atlassian.net/rest/api/3/issue/${{ steps.extract.outputs.issue_key }}/transitions"
